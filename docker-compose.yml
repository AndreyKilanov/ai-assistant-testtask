x-app: &app
  image: amo-assistant:latest
  pull_policy: never
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app
    REDIS_URL: redis://redis:6379/0
    EMBEDDINGS_URL: http://embeddings:80

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64
    command: ["--model-id", "${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}", "--port", "80"]
    volumes:
      - embeddings_cache:/data
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  indexer:
    <<: *app
    command: ["python", "-m", "scripts.index_kb"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      embeddings:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      indexer:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

  api:
    <<: *app
    build: .
    pull_policy: build
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      indexer:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
    restart: unless-stopped

volumes:
  embeddings_cache:
  pgdata:
  redisdata:
