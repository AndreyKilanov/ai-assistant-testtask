[project]
name = "amo-assistant"
version = "0.1.0"
description = "ИИ-ассистент менеджера AmoCRM: ответ клиенту + подсказка по допродаже (RAG)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-postgres>=0.4",
    "llama-index-embeddings-text-embeddings-inference>=0.6",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "arq>=0.26",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
