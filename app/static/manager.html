<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Консоль менеджера · O-Complex</title>
  <link rel="preload" href="/static/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/inter-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/manager.css">
</head>
<body class="manager-page">
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <div>
          <div class="brand-name">O-Complex</div>
          <div class="brand-sub">Консоль менеджера</div>
        </div>
      </div>
      <div class="segmented" id="away" role="group" aria-label="Кто отвечает клиентам" title="Когда вы отошли, ассистент сам отвечает на все входящие. Рискованные вопросы (здоровье, нужен менеджер) он передаёт вам.">
        <button type="button" id="away-off" aria-pressed="true">Менеджер</button>
        <button type="button" id="away-on" aria-pressed="false">Ассистент</button>
      </div>
      <div class="topbar-right">
        <span class="status" id="status" role="status"><i aria-hidden="true"></i><span>Проверяю связь…</span></span>
        <div class="menu model-menu">
          <button type="button" class="model-chip" id="model-chip" aria-haspopup="listbox" aria-expanded="false" title="Выбрать модель"></button>
          <ul class="menu-list" id="model-list" role="listbox" aria-label="Модель ИИ" hidden></ul>
        </div>
        <ul class="stats" id="stats" aria-label="Статистика за сегодня"></ul>
        <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Сменить тему" title="Сменить тему">
        <svg class="icon sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      </div>
    </header>

    <p class="gate-error" id="gate-error" role="alert" hidden></p>

    <main class="console" id="console" data-view="list">
      <section class="pane inbox" aria-labelledby="inbox-title">
        <div class="pane-head">
          <h2 id="inbox-title">Входящие <span class="count" id="inbox-count"></span></h2>
        </div>
        <div class="search">
          <label class="sr-only" for="search">Поиск по клиентам и сообщениям</label>
          <input class="input" id="search" type="search" placeholder="Поиск по имени и тексту">
        </div>
        <div class="filters" id="filters" role="group" aria-label="Фильтр по статусу"></div>
        <ul class="conv-list" id="conv-list" aria-label="Диалоги"></ul>
      </section>

      <div class="resizer" role="separator" aria-orientation="vertical" aria-label="Ширина списка входящих" tabindex="0" title="Потяните, чтобы изменить ширину · двойной клик — сбросить"
           data-var="--inbox-w" data-target=".inbox" data-side="left" data-min="240" data-max="520" data-default="330" data-reserve="760"></div>

      <div class="work">
        <section class="pane thread" aria-labelledby="thread-title">
          <div class="pane-head" id="thread-head"></div>
          <ol class="log" id="log" aria-live="polite" aria-label="Переписка"></ol>
          <div class="composer-wrap" id="reply-box">
            <form class="composer" id="composer" autocomplete="off">
              <label class="sr-only" for="message">Ответ клиенту</label>
              <textarea id="message" rows="1" maxlength="2000" placeholder="Напишите ответ клиенту…"></textarea>
              <button type="submit" class="primary" id="send">Отправить</button>
            </form>
            <div class="composer-foot">
              <span class="kbd-hint"><kbd>Enter</kbd> отправить · <kbd>Shift</kbd> + <kbd>Enter</kbd> новая строка</span>
              <span id="counter" aria-live="polite"></span>
            </div>
          </div>
        </section>

        <div class="resizer" role="separator" aria-orientation="vertical" aria-label="Ширина панели подсказки ИИ" tabindex="0" title="Потяните, чтобы изменить ширину · двойной клик — сбросить"
             data-var="--side-w" data-target=".side" data-side="right" data-min="300" data-max="720" data-default="470" data-reserve="360"></div>

        <aside class="pane side" aria-label="Клиент и подсказка ИИ">
          <div class="side-body" id="side"></div>
        </aside>
      </div>
    </main>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Для работы консоли нужен JavaScript.</p></noscript>
  <script type="module" src="/static/manager.js"></script>
  <script type="module" src="/static/resizers.js"></script>
  <script type="module" src="/static/demo.js"></script>
</body>
</html>
